name: Build Apple (iOS + macOS)

on:
  pull_request:
    paths: &build_apple_paths
      - "lib/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "ios/**"
      - "macos/**"
      - ".github/flutter-version"
      - ".github/actions/setup-flutter/**"
      - ".github/actions/setup-macos-runner-env/**"
      - ".github/scripts/ensure_ios_ci_toolchain.sh"
      - ".github/scripts/apple_spm_hygiene.sh"
      - ".github/scripts/build_ios_ci.sh"
      - ".github/scripts/build_macos_ci.sh"
      - ".github/workflows/build_apple.yml"
  push:
    branches: main
    paths: *build_apple_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS smoke
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-macos-runner-env

      - uses: ./.github/actions/setup-flutter

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install (iOS)
        run: cd ios && pod install

      - name: Ensure iOS Xcode components
        run: bash .github/scripts/ensure_ios_ci_toolchain.sh

      - name: Flutter build ios (debug, compile-only)
        run: bash .github/scripts/build_ios_ci.sh Debug

      - name: Flutter build ios (release, compile-only)
        run: bash .github/scripts/build_ios_ci.sh Release

  macos:
    name: macOS smoke
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-macos-runner-env

      - uses: ./.github/actions/setup-flutter

      - name: Install Homebrew deps (FFmpeg kit)
        run: brew bundle install --file=macos/Brewfile

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install (macOS)
        run: cd macos && pod install

      - name: Flutter build macos (debug)
        run: bash .github/scripts/build_macos_ci.sh Debug

      - name: Flutter build macos (release, compile-only)
        run: bash .github/scripts/build_macos_ci.sh Release
