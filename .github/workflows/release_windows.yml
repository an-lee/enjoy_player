name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build Inno Setup installer (EnjoyPlayerSetup-vX.Y.Z.exe)
        type: boolean
        default: true
      publish:
        description: Upload artifacts + update feeds on dl.enjoy.bot
        type: boolean
        default: false
      publish_github:
        description: Upload binaries to the GitHub Release for this tag (draft; finalize via release_publish.yml)
        type: boolean
        default: false

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Windows release
    runs-on: [self-hosted, windows, flutter]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Short workspace path (Windows MAX_PATH)
        shell: pwsh
        run: .github/scripts/use_short_windows_workdir.ps1

      - uses: ./.github/actions/setup-flutter

      - name: Build Windows release
        shell: pwsh
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        env:
          INPUT_BUILD_INSTALLER: ${{ inputs.build_installer }}
        run: |
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git Bash not found at $gitBash (required for release_windows.sh on Windows)."
          }
          $scriptArgs = @('.github/scripts/release_windows.sh')
          if ($env:INPUT_BUILD_INSTALLER -ne 'true') {
            $scriptArgs += '--no-installer'
          }
          & $gitBash @scriptArgs

      - name: Ensure publish tooling
        if: inputs.publish
        shell: pwsh
        run: .github/scripts/ensure_publish_tooling.ps1

      - name: Publish direct-download feeds
        if: inputs.publish
        shell: pwsh
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          PUBLISH_BUCKET: ${{ secrets.PUBLISH_BUCKET }}
          PUBLISH_PREFIX: player
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SPARKLE_DSA_PRIV_PEM_BASE64: ${{ secrets.SPARKLE_DSA_PRIV_PEM_BASE64 }}
          RELEASE_REQUIRE_S3: "1"
        run: |
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git Bash not found at $gitBash (required for release_windows.sh on Windows)."
          }
          & $gitBash .github/scripts/release_windows.sh --publish-only --publish

      - name: Upload binaries to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $installer = Join-Path $env:GITHUB_WORKSPACE "build\windows\installer\EnjoyPlayerSetup-v${version}.exe"
          if (-not (Test-Path $installer)) {
            throw "Windows installer not found at $installer (expected for tag $tag)."
          }
          & gh release create $tag $installer `
            --title "Enjoy Player $tag" `
            --draft `
            --generate-notes `
            --target main `
            || & gh release upload $tag $installer --clobber

      - name: Upload binaries to GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github
        shell: pwsh
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: |
          $version = (& bash .github/scripts/read_pubspec_version.sh).Trim()
          $tag = "v$version"
          $installer = Join-Path $env:GITHUB_WORKSPACE "build\windows\installer\EnjoyPlayerSetup-v${version}.exe"
          if (-not (Test-Path $installer)) {
            throw "Windows installer not found at $installer (expected for tag $tag)."
          }
          & gh release create $tag $installer `
            --title "Enjoy Player $tag" `
            --draft `
            --generate-notes `
            --target main `
            || & gh release upload $tag $installer --clobber

      - name: Remove short workspace stage
        if: always()
        shell: pwsh
        run: |
          $baseName = Split-Path -Leaf $env:GITHUB_WORKSPACE
          $shortPath = Join-Path 'C:\e' $baseName
          if (Test-Path $shortPath) { Remove-Item -Path $shortPath -Recurse -Force }
