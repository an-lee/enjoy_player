name: Deploy Landing Page

# Required repository secrets (set in Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    Cloudflare API token with "Cloudflare Pages: Edit" permission.
#   CLOUDFLARE_ACCOUNT_ID   Your Cloudflare account ID (32-char hex).
# Without both, `wrangler` cannot authenticate and the job fails — see
# docs/features/landing.md#deployment for setup steps.

on:
  push:
    branches:
      - main
    paths:
      - "landing/**"
  pull_request:
    paths:
      - "landing/**"
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview deploy' || 'Production deploy' }}
    runs-on: ubuntu-latest
    # Skip fork PRs: secrets are not exposed to workflows triggered by
    # pull_request events from forks. Same-repo PRs (and pushes) continue.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6

      - name: Validate required Cloudflare secrets
        env:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -z "$apiToken" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "$accountId" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            {
              echo "::error::Missing required repository secrets: ${missing[*]}"
              echo ""
              echo "Set them at:"
              echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
              echo ""
              echo "  - CLOUDFLARE_API_TOKEN: API token with \"Cloudflare Pages: Edit\""
              echo "  - CLOUDFLARE_ACCOUNT_ID: 32-char Cloudflare account ID"
              echo ""
              echo "See docs/features/landing.md#deployment for the full setup walkthrough."
            } >&2
            exit 1
          fi
          echo "Both Cloudflare secrets are present."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: >
            pages deploy landing
            --project-name enjoy-player-landing
            ${{ github.event_name == 'pull_request' && format('--branch pr-{0}', github.event.pull_request.number) || '--branch main' }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Landing page preview deployed to Cloudflare Pages.'
            });