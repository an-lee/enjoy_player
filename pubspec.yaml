name: enjoy_player
description: Cross-platform audio/video player for language learning with transcripts and shadow reading.
publish_to: 'none'
version: 0.8.5+14

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cross_file: ^0.3.5
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  archive: ^4.0.7
  async: ^2.13.0
  azure_speech:
    path: packages/azure_speech
  forced_alignment:
    path: packages/forced_alignment
  drift: ^2.31.0
  drift_flutter: ^0.3.1
  # Pre-release dep (single-publisher supply chain) — pinned exactly so a
  # fresh `pub get` cannot upgrade without an explicit PR. See ADR-0029.
  file_picker: ^12.0.0-beta.7
  freezed_annotation: ^3.0.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.2.0
  go_router: ^17.2.3
  http: ^1.4.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.16.0
  media_kit: ^1.2.2
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.0
  audioplayers: ^6.1.0
  ffmpeg_kit_flutter_new:
    path: packages/ffmpeg_kit_flutter_new
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.5.0
  package_info_plus: ^10.1.0
  # Pre-release / single-publisher deps (Windows + mobile auto-update flow).
  # Pinned exactly so `pub get` cannot silently upgrade; bump via PR. See
  # ADR-0029.
  auto_updater: ^1.0.0
  ota_update: 7.1.0
  record: ^7.0.0
  riverpod_annotation: ^4.0.3
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  app_links: ^7.2.1
  uuid: ^4.5.1
  palette_generator: ^0.3.3+7
  flutter_inappwebview: ^6.1.5
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.2.3
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  skeletonizer: ^2.1.3
  showcaseview: ^5.1.0
  window_manager: ^0.5.1
  ai_sdk_dart: ^1.2.0
  ai_sdk_openai: ^1.2.0
  ai_sdk_anthropic: ^1.2.0
  ai_sdk_google: ^1.2.0
  ai_sdk_provider: ^1.2.0
  flutter_timezone: ^5.1.0
  # Pin `jni_flutter` >= 1.0.2 so the transitive `jni` resolves past the
  # retracted 1.0.1 (Flutter pub surfaces a "version 1.0.1 is retracted"
  # warning otherwise). The `jni` 1.0.3 API used by `path_provider_android` is
  # ABI-compatible with the surface the app exercises.
  jni_flutter: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  url_launcher_platform_interface: ^2.3.2
  flutter_lints: ^6.0.0
  # Cap at 2.15.1: 2.15.2+ needs analyzer >=13.3, which is blocked by
  # riverpod_generator 4.0.4 / riverpod_analyzer_utils (analyzer ^12).
  # riverpod_generator 4.0.6 is currently unsolvable (analyzer ^13 + rau ^12).
  build_runner: ^2.15.1
  # Cap at 2.34.0: 2.34.1+ needs analyzer ^13 (same riverpod ceiling).
  drift_dev: ^2.34.0
  # Pre-release — pinned exactly so `pub get` cannot upgrade without a PR.
  # freezed 4.0.0-dev.3 needs analyzer ^13; blocked until riverpod ships rau for 13.
  freezed: 3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo-light.svg
    - assets/illustrations/
    - assets/discover/recommended_channels.json
    # Vendored eSpeak-NG voices/dicts; extracted to disk on Android at startup
    # (espeak_android_provisioner) because eSpeak fopens real files.
    # Flutter does not recurse: each directory needs its own entry or `lang/`
    # is omitted and espeak_SetVoiceByName(en-us) fails on Android.
    - packages/forced_alignment/native/espeak-ng-data/
    - packages/forced_alignment/native/espeak-ng-data/lang/

