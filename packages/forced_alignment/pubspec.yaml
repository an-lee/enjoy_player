name: forced_alignment
description: >
  On-device forced alignment: known text + 16 kHz mono PCM to word/phone
  timings (eSpeak-style reference + MFCC + windowed DTW).
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  mcfcc_nsn: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
